<style>
  .style-study {
    max-width: 1500px;
    margin: 0 auto;
  }
  .style-study h2 {
    font-family: "Courier New", monospace;
    letter-spacing: -0.03em;
  }
  .style-study .intro {
    max-width: 720px;
    margin-bottom: 1.5rem;
  }
  .style-study .disclaimer {
    display: inline-block;
    margin-top: -0.75rem;
    margin-bottom: 1.5rem;
    padding: 0.45rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
    font-size: 0.72rem;
    letter-spacing: 0.02em;
  }
  .style-study .cards {
    align-items: start;
    gap: 1.25rem;
  }
  .style-study .card {
    border-radius: 10px;
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .style-study .card:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 4px;
  }
  .style-study .card-image {
    display: block;
    aspect-ratio: 16 / 9;
    height: auto;
    background: #111;
  }
  .style-study .scene {
    display: block;
    width: 100%;
    height: 100%;
  }
  .style-study .card-body {
    padding: 1rem 1.05rem 1.15rem;
  }
  .style-study .card-body h3 {
    font-family: "Courier New", monospace;
    font-size: 1rem;
    letter-spacing: 0.02em;
  }
  .style-study .card-body p {
    line-height: 1.45;
  }
  .style-study .tag {
    display: block;
    margin-bottom: 0.45rem;
    color: var(--text-tertiary);
    font: 700 0.66rem/1 "Courier New", monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .scene text {
    font-family: "Courier New", monospace;
    font-weight: 700;
  }
  .scene .ship-pixel { shape-rendering: crispEdges; }
  .scene .tower-pixel { shape-rendering: crispEdges; }
  .scene .thin { vector-effect: non-scaling-stroke; }
  @media (max-width: 760px) {
    .style-study .cards { grid-template-columns: 1fr; }
    .style-study .card-image { max-height: none; }
  }
</style>

<section class="style-study" aria-labelledby="style-question">
  <h2 id="style-question">Which retro style should we build?</h2>
  <p class="subtitle intro">Choose the visual language that best fits this tower game. Each panel is a static style study, not playable game code.</p>
  <p class="disclaimer">Static mockups only - no gameplay or mechanics are implemented at this stage.</p>

  <div class="cards">
    <button class="card" type="button" data-choice="arcade" onclick="toggleSelect(this)">
      <div class="card-image">
        <svg class="scene" viewBox="0 0 960 540" role="img" aria-labelledby="arcade-title arcade-desc">
          <title id="arcade-title">Classic arcade tower game scene</title>
          <desc id="arcade-desc">A pixel ship flies from the upper left toward a falling bomb above nine amber towers.</desc>
          <rect width="960" height="540" fill="#101827"/>
          <g fill="#e8edf2" font-size="25"><text x="38" y="48">SCORE 001200</text><text x="782" y="48" fill="#e8a443">1UP</text></g>
          <line x1="28" y1="166" x2="932" y2="166" stroke="#ed5b50" stroke-width="4" stroke-dasharray="16 12"/>
          <text x="740" y="151" fill="#ed5b50" font-size="16">MAX HEIGHT</text>
          <g class="ship-pixel" fill="#f6f0d8">
            <path d="M72 117h17V99h19v18h54v10h18v13h-18v10h-54v18H89v-18H72v-10H54v-13h18z"/>
            <rect x="103" y="91" width="19" height="8" fill="#e8a443"/><rect x="39" y="130" width="15" height="7" fill="#e8a443"/>
          </g>
          <g fill="#ed5b50" class="ship-pixel"><rect x="462" y="246" width="20" height="32"/><rect x="454" y="254" width="36" height="16"/><rect x="458" y="278" width="28" height="12"/><path d="M458 290h9v13h-9zm20 0h9v13h-9z"/></g>
          <g fill="#e8a443" class="tower-pixel">
            <path d="M42 458h85V341h-16v-17H58v17H42z"/><path d="M143 458h85V365h-16v-17h-53v17h-16z"/><path d="M244 458h85V300h-16v-17h-53v17h-16z"/>
            <path d="M345 458h85V382h-16v-17h-53v17h-16z"/><path d="M446 458h85V330h-16v-17h-53v17h-16z"/><path d="M547 458h85V352h-16v-17h-53v17h-16z"/>
            <path d="M648 458h85V294h-16v-17h-53v17h-16z"/><path d="M749 458h85V375h-16v-17h-53v17h-16z"/><path d="M850 458h68V324h-14v-17h-40v17h-14z"/>
          </g>
          <g fill="#101827" class="tower-pixel"><path d="M66 373h15v15H66zm37 0h15v15h-15zM66 414h15v15H66zm37 0h15v15h-15z"/><path d="M167 395h15v15h-15zm37 0h15v15h-15z"/><path d="M268 330h15v15h-15zm37 0h15v15h-15zM268 373h15v15h-15zm37 0h15v15h-15zM268 416h15v15h-15zm37 0h15v15h-15z"/><path d="M369 410h15v15h-15zm37 0h15v15h-15zM470 358h15v15h-15zm37 0h15v15h-15zM571 380h15v15h-15zm37 0h15v15h-15z"/><path d="M672 324h15v15h-15zm37 0h15v15h-15zM672 367h15v15h-15zm37 0h15v15h-15zM773 399h15v15h-15zm37 0h15v15h-15zM868 348h14v15h-14zM899 348h14v15h-14z"/></g>
          <line x1="28" y1="477" x2="932" y2="477" stroke="#e8a443" stroke-width="5"/>
          <text x="40" y="515" fill="#e8a443" font-size="21">SPACE / DROP BOMB</text><text x="820" y="515" fill="#e8edf2" font-size="18">READY</text>
        </svg>
      </div>
      <div class="card-body"><span class="tag">A - Recommended</span><h3>Classic arcade</h3><p>Chunky pixels, clear silhouettes, classic arcade feel.</p></div>
    </button>

    <button class="card" type="button" data-choice="phosphor" onclick="toggleSelect(this)">
      <div class="card-image">
        <svg class="scene" viewBox="0 0 960 540" role="img" aria-labelledby="phosphor-title phosphor-desc">
          <title id="phosphor-title">Phosphor tower game scene</title><desc id="phosphor-desc">A green outlined ship, bomb, and towers in a restrained monochrome display.</desc>
          <rect width="960" height="540" fill="#07110a"/><g fill="#83ee98" font-size="25"><text x="38" y="48">SCORE 001200</text><text x="782" y="48">1UP</text></g>
          <line x1="28" y1="166" x2="932" y2="166" stroke="#83ee98" stroke-width="2" stroke-dasharray="16 12" opacity=".7"/><text x="740" y="151" fill="#83ee98" font-size="16">MAX HEIGHT</text>
          <g fill="none" stroke="#83ee98" stroke-width="5" class="thin"><path d="M54 130h34V99h20v31h74v13h-21v11h-53v18H88v-18H54z"/><path d="M103 91h19v8h-19M39 130h15"/></g>
          <g fill="none" stroke="#83ee98" stroke-width="4" class="thin"><circle cx="472" cy="267" r="18"/><path d="M472 238v10m0 38v10m-29-29h10m38 0h10"/></g>
          <g fill="none" stroke="#83ee98" stroke-width="4" class="thin"><path d="M42 458h85V341h-16v-17H58v17H42zM143 458h85V365h-16v-17h-53v17h-16zM244 458h85V300h-16v-17h-53v17h-16zM345 458h85V382h-16v-17h-53v17h-16zM446 458h85V330h-16v-17h-53v17h-16zM547 458h85V352h-16v-17h-53v17h-16zM648 458h85V294h-16v-17h-53v17h-16zM749 458h85V375h-16v-17h-53v17h-16zM850 458h68V324h-14v-17h-40v17h-14z"/><path d="M66 373h15v15H66zm37 0h15v15h-15zM167 395h15v15h-15zm37 0h15v15h-15zM268 330h15v15h-15zm37 0h15v15h-15zM470 358h15v15h-15zm37 0h15v15h-15zM672 324h15v15h-15zm37 0h15v15h-15zM773 399h15v15h-15zm37 0h15v15h-15z"/></g>
          <line x1="28" y1="477" x2="932" y2="477" stroke="#83ee98" stroke-width="2"/><text x="40" y="515" fill="#83ee98" font-size="21">SPACE / DROP BOMB</text><text x="820" y="515" fill="#83ee98" font-size="18">READY</text>
        </svg>
      </div>
      <div class="card-body"><span class="tag">B - Restrained</span><h3>Phosphor</h3><p>Minimal monochrome; less color to distinguish hazards.</p></div>
    </button>

    <button class="card" type="button" data-choice="vector" onclick="toggleSelect(this)">
      <div class="card-image">
        <svg class="scene" viewBox="0 0 960 540" role="img" aria-labelledby="vector-title vector-desc">
          <title id="vector-title">Vector tower game scene</title><desc id="vector-desc">A cyan outlined ship and magenta outlined towers in a crisp vector display.</desc>
          <rect width="960" height="540" fill="#100c22"/><g fill="#f5eaff" font-size="25"><text x="38" y="48">SCORE 001200</text><text x="782" y="48" fill="#67e8f9">1UP</text></g>
          <line x1="28" y1="166" x2="932" y2="166" stroke="#e879f9" stroke-width="2" stroke-dasharray="5 10"/><text x="740" y="151" fill="#e879f9" font-size="16">MAX HEIGHT</text>
          <g fill="none" stroke="#67e8f9" stroke-width="3" class="thin"><path d="M54 130h34V99h20v31h74v13h-21v11h-53v18H88v-18H54z"/><path d="M103 91h19v8h-19M39 130h15"/></g>
          <g fill="none" stroke="#e879f9" stroke-width="3" class="thin"><path d="M472 238l16 29-16 29-16-29z"/><path d="M472 230v8m0 58v8"/></g>
          <g fill="none" stroke="#e879f9" stroke-width="3" class="thin"><path d="M42 458h85V341h-16v-17H58v17H42zM143 458h85V365h-16v-17h-53v17h-16zM244 458h85V300h-16v-17h-53v17h-16zM345 458h85V382h-16v-17h-53v17h-16zM446 458h85V330h-16v-17h-53v17h-16zM547 458h85V352h-16v-17h-53v17h-16zM648 458h85V294h-16v-17h-53v17h-16zM749 458h85V375h-16v-17h-53v17h-16zM850 458h68V324h-14v-17h-40v17h-14z"/><path d="M66 373h15v15H66zm37 0h15v15h-15zM167 395h15v15h-15zm37 0h15v15h-15zM268 330h15v15h-15zm37 0h15v15h-15zM470 358h15v15h-15zm37 0h15v15h-15zM672 324h15v15h-15zm37 0h15v15h-15zM773 399h15v15h-15zm37 0h15v15h-15z"/></g>
          <line x1="28" y1="477" x2="932" y2="477" stroke="#67e8f9" stroke-width="2"/><text x="40" y="515" fill="#67e8f9" font-size="21">SPACE / DROP BOMB</text><text x="820" y="515" fill="#f5eaff" font-size="18">READY</text>
        </svg>
      </div>
      <div class="card-body"><span class="tag">C - High contrast</span><h3>Vector</h3><p>Brighter outlines and glow; less strictly pixel-retro.</p></div>
    </button>
  </div>
</section>
